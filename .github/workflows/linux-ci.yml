name: Linux CI

on:
  pull_request:
    branches: [main, development]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-22.04

    steps:
      - name: Use HTTPS for github.com submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: .qt
          key: qt-6.8.3-linux-gcc_64-qtcharts-qtwebsockets

      - name: Install Qt 6.8.3 via aqt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop 6.8.3 linux_gcc_64 \
            --modules qtcharts qtwebsockets --outputdir ./.qt

      - name: Install Qt 6 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - uses: conan-io/setup-conan@v1
        with:
          cache_packages: true

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - name: Build
        run: ./build.sh

      - name: ccache stats
        if: success()
        run: ccache -s
