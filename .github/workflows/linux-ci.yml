name: Linux CI

on:
  pull_request:
    branches: [main, development]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt trusted runs while they are publishing newly built Conan
  # packages. Superseded pull-request runs remain safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/pre-commit.yml
    permissions:
      contents: read

  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    # Backstop against hangs (a deadlocked test otherwise holds the runner for
    # GitHub's 6-hour default). Worst observed legitimate run — cold Conan +
    # cold ccache — is ~28 min.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write   # push/pull the Conan cache OCI artifact on ghcr.io

    steps:
      - name: Free up runner disk space
        # ubuntu runners ship ~14 GB free; the RelWithDebInfo link of pj_app
        # (FFmpeg/assimp/Qt + debug info) over the Conan closure can exceed it
        # ("ld: No space left on device" during the final link). Reclaim the
        # preinstalled toolchains this build never uses (~20-30 GB).
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Use HTTPS for github.com submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source ./versions.env
          echo "PJ_APP_VERSION=${PJ_APP_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_QT_VERSION=${PJ_QT_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_APPIMAGE_ARCH=${PJ_APPIMAGE_ARCH}" >> "${GITHUB_ENV}"
          echo "app_version=${PJ_APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "qt_version=${PJ_QT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "appimage_arch=${PJ_APPIMAGE_ARCH}" >> "${GITHUB_OUTPUT}"

      - uses: conan-io/setup-conan@v1
        with:
          # Trusted runs resolve packages from JFrog first. The existing GHCR
          # and Actions caches remain as migration/fork fallback layers while
          # the Linux package matrix is populated in Artifactory.
          cache_packages: false

      - name: Setup oras (OCI Registry As Storage)
        # Primary install path. continue-on-error so a 5xx on the github.com
        # release CDN doesn't kill CI — we have a fallback below, and worst
        # case we degrade to "no Conan cache this run" (build still completes).
        id: setup_oras
        uses: oras-project/setup-oras@v1
        continue-on-error: true

      - name: Setup oras (manual download fallback)
        id: setup_oras_fallback
        if: steps.setup_oras.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version="1.3.0"
          url="https://github.com/oras-project/oras/releases/download/v${version}/oras_${version}_linux_amd64.tar.gz"
          tarball="${RUNNER_TEMP}/oras.tar.gz"
          install_dir="${RUNNER_TEMP}/oras-bin"
          mkdir -p "${install_dir}"

          attempts=0
          until curl -fsSL "${url}" -o "${tarball}"; do
            attempts=$((attempts + 1))
            if [ "${attempts}" -ge 5 ]; then
              echo "Download failed after ${attempts} attempts" >&2
              exit 1
            fi
            delay=$((5 * (2 ** attempts)))
            echo "Download attempt ${attempts} failed; retrying in ${delay}s..."
            sleep "${delay}"
          done
          tar -xzf "${tarball}" -C "${install_dir}"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/oras" version

      - name: Compute Conan cache tag
        id: conan_cache
        shell: bash
        run: |
          set -euo pipefail
          # Hash every conanfile.txt under the tree (today the top-level
          # one; future submodules under PJ4 may add their own) so the
          # key invalidates when any of them changes.
          hash=$(find . -name conanfile.txt -not -path './build/*' -not -path './.git/*' \
                  -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="ghcr.io/${owner}/pj4-conan-cache:linux-gcc-relwithdebinfo-${hash}"
          echo "hash=${hash}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Cache tag: ${tag}"

      - name: Login to ghcr.io
        if: github.repository_owner == 'PlotJuggler' && (steps.setup_oras.outcome == 'success' || steps.setup_oras_fallback.outcome == 'success')
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Restore Conan cache from ghcr.io
        if: github.repository_owner == 'PlotJuggler' && (steps.setup_oras.outcome == 'success' || steps.setup_oras_fallback.outcome == 'success')
        shell: bash
        run: |
          set +e
          tag="${{ steps.conan_cache.outputs.tag }}"
          pull_dir="${RUNNER_TEMP}/conan-cache-pull"
          mkdir -p "${pull_dir}"
          (
            cd "${pull_dir}"
            oras pull "${tag}" 2>&1
          )
          pulled=$?
          tarball="${pull_dir}/conan-cache.tar.zst"
          if [ "${pulled}" -eq 0 ] && [ -f "${tarball}" ]; then
            echo "Cache HIT: extracting ${tarball}"
            mkdir -p "${HOME}/.conan2"
            tar --zstd -xf "${tarball}" -C "${HOME}"
            echo "CONAN_CACHE_HIT=1" >> "${GITHUB_ENV}"
          else
            echo "Cache MISS for ${tag} (cold start or first build of this conanfile)"
          fi
          # Always exit 0 — a missing tag is not a CI failure.
          exit 0

      - name: Restore Conan cache from GitHub Actions cache
        # Fallback layer under the ghcr.io cache above. ghcr.io only restores on
        # the canonical PlotJuggler repo (it needs the registry token) and only
        # *saves* on push-to-main, so PRs that touch conanfile.txt — and every
        # build on a fork — get a ghcr.io MISS and rebuild all third-party deps
        # (~6.5 min: libiconv, lz4, zstd, ffmpeg, …) from source on every run.
        # The native Actions cache fills that gap: it works on PRs and forks with
        # no token, so a PR's 2nd+ run (and any PR rebased on a main that already
        # primed this key) restores the built packages instead of recompiling.
        # Skipped when ghcr.io already produced a HIT — ~/.conan2 is populated.
        id: conan-gha-cache
        if: env.CONAN_CACHE_HIT != '1'
        uses: actions/cache/restore@v5
        with:
          path: ~/.conan2
          # v2 prefix (July 2026): bumped to invalidate caches carrying the
          # pre-#30610 assimp/5.4.3 recipe revision (which still pins draco/1.5.6
          # and clashes with our new draco/1.5.7 pin). Fold this suffix out once
          # everyone has moved past the transition.
          key: conan-linux-gcc-relwithdebinfo-v2-${{ steps.conan_cache.outputs.hash }}
          # Partial reuse when conanfile.txt changes: an older closure for the
          # same OS/compiler still seeds most packages, so only the changed dep
          # (and its dependents) rebuild rather than the whole graph.
          restore-keys: |
            conan-linux-gcc-relwithdebinfo-v2-

      - name: Configure public Conan repository for pull requests
        if: github.event_name == 'pull_request' || github.repository != 'PlotJuggler/PJ4'
        shell: bash
        run: |
          # The current JFrog token can deploy packages, so never expose it to
          # pull-request or fork-controlled workflow code.
          echo "PJ_USE_JFROG=false" >> "$GITHUB_ENV"

      - name: Configure JFrog Conan repository
        if: github.event_name != 'pull_request' && github.repository == 'PlotJuggler/PJ4'
        id: conan_remote
        shell: bash
        env:
          JFROG_USER: ${{ vars.JFROG_USER || secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$JFROG_USER" || -z "$JFROG_TOKEN" ]]; then
            echo "::error::Configure JFROG_USER as an Actions variable or secret, and JFROG_TOKEN as an Actions secret."
            exit 1
          fi

          conan remote add plotjuggler-conan \
            "https://plotjuggler.jfrog.io/artifactory/api/conan/plotjuggler-conan" \
            --force --index=0
          conan remote login plotjuggler-conan "$JFROG_USER" -p "$JFROG_TOKEN"
          echo "PJ_USE_JFROG=true" >> "$GITHUB_ENV"
          echo "authenticated=true" >> "$GITHUB_OUTPUT"
          conan remote list

      - name: Seed Conan source download cache
        # minizip/1.2.13 has a single zlib.net source URL that rejects GitHub
        # runners with HTTP 415. Use the same checksum-verified, repo-hosted
        # Conan download-cache seed as the proven Windows workflows. This is
        # deliberately configured after restoring ~/.conan2 so a restored
        # global.conf cannot clobber it.
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${RUNNER_TEMP}/conan-source-cache"
          mkdir -p "${cache_dir}/s"
          find .github/conan/source-backup -maxdepth 1 -type f ! -name README.md \
            -exec cp -f {} "${cache_dir}/s/" \;

          conan_home="$(conan config home)"
          conf="${conan_home}/global.conf"
          mkdir -p "${conan_home}"
          if [[ -f "$conf" ]]; then
            grep -v '^core\.sources:download_cache=' "$conf" > "${conf}.tmp" || true
            mv "${conf}.tmp" "$conf"
          fi
          echo "core.sources:download_cache=${cache_dir}" >> "$conf"
          cat "$conf"

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v5
        with:
          path: .qt
          key: qt-${{ steps.versions.outputs.qt_version }}-linux-gcc_64

      - name: Install Qt via aqt
        # Delegates to the repo-root install script, which reads versions.env.
        # It installs into ./.qt and no-ops if present.
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: ./install_qt6.sh

      - name: Install Qt 6 + FFmpeg VAAPI system dependencies
        run: |
          sudo apt-get update
          # libva-dev / libdrm-dev are required by the FFmpeg Conan build:
          # with_vaapi=True pulls vaapi/system, whose package_info resolves libva
          # and libva-drm via pkg-config — they must exist on the build host.
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libva-dev libdrm-dev \
            xvfb ccache zstd

      - name: Configure ccache
        # Compiler-output cache for our own C++ — complementary to the Conan
        # cache (which holds prebuilt third-party packages, not our objects).
        # Keep the regular-build namespace disjoint from TSan. The former
        # `ccache-linux-` catch-all selected the newer ccache-linux-tsan-* entry
        # and produced 0/810 hits because sanitizer objects are incompatible.
        # Restore-only on pull requests: PR-scoped archives (~0.65 GB per open
        # PR) were a top consumer of the shared 10 GB quota whose LRU eviction
        # victim is the Windows sccache. PRs still restore main's objects, so
        # only the PR's own edits recompile on repeat pushes.
        id: ccache_restore
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ccache
          key: ccache-linux-build-${{ github.ref_name }}-${{ github.sha }}
          # The final two are safe migration paths: both identify regular
          # builds explicitly by ref and cannot match ccache-linux-tsan-*.
          restore-keys: |
            ccache-linux-build-${{ github.ref_name }}-
            ccache-linux-build-main-
            ccache-linux-${{ github.ref_name }}-
            ccache-linux-main-

      - name: Set ccache limits
        # 2G, not 500M: the full compiled object set (esp. after the Qt
        # bump, whose larger headers grew per-TU output) exceeds 500M, so a
        # 500M cap thrashed — ccache evicted this build's own early objects
        # mid-run (observed: 25 cleanups, 39% hit rate), leaving every later
        # build permanently partially-cold. 2G holds the whole warm set.
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache -z

      - name: Conan install
        # Match the proven Windows sequencing: resolve/build the dependency
        # graph, publish it immediately, then compile PlotJuggler. A later app
        # compile failure must not discard an otherwise reusable Conan closure.
        id: conan_install
        shell: bash
        run: |
          set -euo pipefail
          conan profile detect --force
          conan_remotes=(-r=conancenter)
          if [[ "$PJ_USE_JFROG" == "true" ]]; then
            bash .github/scripts/sync-conan-recipes.sh \
              -s build_type=RelWithDebInfo -s compiler.cppstd=20
            conan_remotes=(-r=plotjuggler-conan -r=conancenter)
          fi
          conan_log="${RUNNER_TEMP}/pj4-conan-install.log"
          conan install . --output-folder=build --build=missing "${conan_remotes[@]}" \
            -s build_type=RelWithDebInfo -s compiler.cppstd=20 \
            2>&1 | tee "$conan_log"
          if grep -q "Building from source" "$conan_log"; then
            echo "::notice::Conan built missing Linux binaries; trusted jobs will publish them to JFrog."
          fi

      - name: Publish Conan packages to JFrog
        if: steps.conan_install.outcome == 'success' && steps.conan_remote.outputs.authenticated == 'true'
        shell: bash
        run: |
          # Upload both downloaded recipes and Linux binaries built by
          # --build=missing before compiling the application. Existing
          # revisions are skipped by Conan.
          conan upload "*" -r=plotjuggler-conan --confirm \
            -cc core.upload:parallel=4

      - name: Remove JFrog credentials from Conan home
        # ~/.conan2 is archived below. Logout even when install/upload fails
        # so a deploy-capable token can never enter GHCR or Actions caches.
        if: always() && steps.conan_remote.outputs.authenticated == 'true'
        shell: bash
        run: conan remote logout plotjuggler-conan

      - name: Build
        # Conan already generated build/conan_toolchain.cmake above. Do not
        # resolve the graph twice (and do not require JFrog credentials during
        # the much longer application compile).
        run: ./build.sh --skip-conan-install

      - name: Save Conan cache to ghcr.io
        # Only push from the canonical repo on real pushes (forks lack write
        # access to ghcr.io packages). Skip on cache HIT — the tag content is
        # already up to date, no point re-uploading the same bytes.
        if: github.event_name == 'push' && github.repository == 'PlotJuggler/PJ4' && env.CONAN_CACHE_HIT != '1' && (steps.setup_oras.outcome == 'success' || steps.setup_oras_fallback.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.conan_cache.outputs.tag }}"
          tarball="${RUNNER_TEMP}/conan-cache.tar.zst"

          # Trim build trees before packing so the uploaded artifact only
          # contains the package binaries consumers actually need.
          conan cache clean "*" --build --source --temp

          echo "Packing ~/.conan2 -> ${tarball}"
          tar --zstd -cf "${tarball}" -C "${HOME}" .conan2

          size_mb=$(du -m "${tarball}" | cut -f1)
          echo "Compressed cache size: ${size_mb} MB"

          (
            cd "${RUNNER_TEMP}"
            oras push "${tag}" "conan-cache.tar.zst:application/vnd.oci.image.layer.v1.tar+zstd"
          )

      - name: Trim Conan cache before saving
        # Drop build/source/temp trees so only the package binaries consumers
        # need are persisted (matches the ghcr.io save above). Runs only when
        # we're about to save a fresh GHA cache entry.
        if: always() && env.CONAN_CACHE_HIT != '1' && steps.conan-gha-cache.outputs.cache-hit != 'true'
        shell: bash
        run: conan cache clean "*" --build --source --temp || true

      - name: Save Conan cache to GitHub Actions cache
        # Persist the built closure under the exact conanfile hash so the next
        # run on this branch (or any branch keyed identically) restores it.
        # `always()` so a failing project compile still saves the third-party
        # deps that finished earlier — they're the expensive part. Skipped on a
        # ghcr.io HIT or an exact GHA-key hit: ~/.conan2 is already current, and
        # GHA cache keys are immutable so re-saving the same key is a no-op.
        if: always() && env.CONAN_CACHE_HIT != '1' && steps.conan-gha-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.conan2
          key: conan-linux-gcc-relwithdebinfo-v2-${{ steps.conan_cache.outputs.hash }}

      - name: Save ccache
        # always(): objects from a build whose tests failed are still valid.
        if: always() && github.event_name != 'pull_request' && steps.ccache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ccache
          key: ccache-linux-build-${{ github.ref_name }}-${{ github.sha }}

      - name: ccache stats
        if: success()
        run: ccache -s

      - name: Test
        # --timeout kills any single test after 2 min (the suite normally
        # finishes in well under that), so one deadlocked test fails loudly
        # with its name in the log instead of stalling the whole job.
        run: xvfb-run -a ctest --test-dir build --output-on-failure --timeout 120

  tsan:
    # ThreadSanitizer guard for the datastore worker-thread races (e.g. the
    # streaming pause/resume WriteCore swap). Builds + runs ONLY the Qt-free
    # foundation concurrency tests under -fsanitize=thread — no GUI, no xvfb. Runs
    # in parallel with `build`, sharing its cached Qt + RelWithDebInfo Conan
    # closure (only our own sources get instrumented). See ./build.sh --tsan.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Use HTTPS for github.com submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source ./versions.env
          echo "PJ_APP_VERSION=${PJ_APP_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_QT_VERSION=${PJ_QT_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_APPIMAGE_ARCH=${PJ_APPIMAGE_ARCH}" >> "${GITHUB_ENV}"
          echo "app_version=${PJ_APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "qt_version=${PJ_QT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "appimage_arch=${PJ_APPIMAGE_ARCH}" >> "${GITHUB_OUTPUT}"

      - uses: conan-io/setup-conan@v1
        with:
          cache_packages: false

      - name: Compute Conan cache hash
        id: conan_cache
        shell: bash
        run: |
          set -euo pipefail
          # Same hash as the `build` job so we restore its prebuilt closure.
          hash=$(find . -name conanfile.txt -not -path './build/*' -not -path './.git/*' \
                  -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)
          echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore Conan cache from GitHub Actions cache
        # Shares the build job's RelWithDebInfo key — TSan reuses the same prebuilt
        # dependency binaries (instrumentation is applied only to our sources).
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          key: conan-linux-gcc-relwithdebinfo-v2-${{ steps.conan_cache.outputs.hash }}
          restore-keys: |
            conan-linux-gcc-relwithdebinfo-v2-

      - name: Configure public Conan repository for pull requests
        if: github.event_name == 'pull_request' || github.repository != 'PlotJuggler/PJ4'
        shell: bash
        run: echo "PJ_USE_JFROG=false" >> "$GITHUB_ENV"

      - name: Configure JFrog Conan repository
        if: github.event_name != 'pull_request' && github.repository == 'PlotJuggler/PJ4'
        id: conan_remote
        shell: bash
        env:
          JFROG_USER: ${{ vars.JFROG_USER || secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$JFROG_USER" || -z "$JFROG_TOKEN" ]]; then
            echo "::error::Configure JFROG_USER as an Actions variable or secret, and JFROG_TOKEN as an Actions secret."
            exit 1
          fi

          conan remote add plotjuggler-conan \
            "https://plotjuggler.jfrog.io/artifactory/api/conan/plotjuggler-conan" \
            --force --index=0
          conan remote login plotjuggler-conan "$JFROG_USER" -p "$JFROG_TOKEN"
          echo "PJ_USE_JFROG=true" >> "$GITHUB_ENV"
          echo "authenticated=true" >> "$GITHUB_OUTPUT"
          conan remote list

      - name: Seed Conan source download cache
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${RUNNER_TEMP}/conan-source-cache"
          mkdir -p "${cache_dir}/s"
          find .github/conan/source-backup -maxdepth 1 -type f ! -name README.md \
            -exec cp -f {} "${cache_dir}/s/" \;

          conan_home="$(conan config home)"
          conf="${conan_home}/global.conf"
          mkdir -p "${conan_home}"
          if [[ -f "$conf" ]]; then
            grep -v '^core\.sources:download_cache=' "$conf" > "${conf}.tmp" || true
            mv "${conf}.tmp" "$conf"
          fi
          echo "core.sources:download_cache=${cache_dir}" >> "$conf"
          cat "$conf"

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v5
        with:
          path: .qt
          key: qt-${{ steps.versions.outputs.qt_version }}-linux-gcc_64

      - name: Install Qt via aqt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: ./install_qt6.sh

      - name: Install Qt 6 + FFmpeg VAAPI system dependencies
        # Same set as the `build` job: configure still runs find_package(Qt6) for
        # the modules it won't build, and `conan install` resolves the full graph
        # (FFmpeg's vaapi/system needs libva-dev / libdrm-dev at generate time).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libva-dev libdrm-dev \
            ccache

      - name: Lower ASLR entropy for sanitizers
        # Modern kernels default vm.mmap_rnd_bits high enough that the TSan runtime
        # aborts at startup with "unexpected memory mapping". 28 is the value the
        # sanitizer runtimes expect; harmless otherwise.
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: Configure ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-linux-tsan-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-tsan-${{ github.ref_name }}-
            ccache-linux-tsan-

      - name: Set ccache limits
        run: |
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache -z

      - name: Refresh ConanCenter recipe revisions in JFrog
        if: steps.conan_remote.outputs.authenticated == 'true'
        shell: bash
        run: |
          conan profile detect --force
          bash .github/scripts/sync-conan-recipes.sh \
            -s build_type=RelWithDebInfo -s compiler.cppstd=20

      - name: Build + run foundation tests under ThreadSanitizer
        run: ./build.sh --tsan

      - name: Publish Conan packages to JFrog
        # TSan resolves the same RelWithDebInfo dependency graph as the regular
        # build, but a refreshed recipe can still require a binary that this
        # runner is first to build. Persist it instead of rebuilding next run.
        if: success() && steps.conan_remote.outputs.authenticated == 'true'
        shell: bash
        run: |
          conan upload "*" -r=plotjuggler-conan --confirm \
            -cc core.upload:parallel=4

      - name: Remove JFrog credentials from Conan home
        # The combined actions/cache step saves ~/.conan2 during post-job
        # cleanup, so remove authentication first on both success and failure.
        if: always() && steps.conan_remote.outputs.authenticated == 'true'
        shell: bash
        run: conan remote logout plotjuggler-conan

      - name: ccache stats
        if: success()
        run: ccache -s
