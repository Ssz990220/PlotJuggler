name: Release Windows Installer

# Builds the PlotJuggler 4 Windows installer (.exe) on a clean windows-2022 runner
# and, on a version tag, attaches it to the GitHub Release. The Windows sibling of
# release.yml (which does the Linux AppImage).
#
# A clean runner (single MSVC toolset, empty Conan cache) is also what makes the
# plugin builds succeed here: the toolset/cache link failures seen on developer
# machines (date-tz / ixwebsocket "unresolved external __std_*", stale /EHsc caches)
# do not happen on a fresh image. The installer recipe treats a plugin that still
# fails to build as non-fatal, so the rest still ship.
#
# Cache: ports the three cache layers from windows-ci.yml so the build is not
# cold every dispatch.
#   - Qt kit via actions/cache
#   - sccache via actions/cache (585 TU compiler cache)
#   - Conan closure via ghcr.io OCI + actions/cache fallback (>10 GB)
#
# Triggers:
#   - workflow_dispatch -> build the installer from any branch (artifact only)
#   - push of a `v*` tag -> build + attach the installer to that tag's Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write     # softprops/action-gh-release needs write to create/update the Release
  packages: write     # push/pull the Conan cache OCI artifact on ghcr.io

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    # Pinned to windows-2022 (see windows-ci.yml): the VS18/MSVC 14.5x image breaks
    # the libsodium/1.0.20 Conan recipe that some plugins pull in.
    runs-on: windows-2022
    # Backstop against hangs — same rationale as windows-ci.yml, with margin for
    # the extra installer-side ported-plugin builds after the app compile.
    timeout-minutes: 180

    env:
      # Pin sccache's object cache to a known path so actions/cache can persist
      # it across runs (see the "Restore/Save sccache cache" steps). Without a
      # persisted cache, sccache's local disk starts empty every run — a 0% hit
      # rate that forces all ~585 translation units to recompile cold (~30 min).
      # SCCACHE_CACHE_SIZE bounds the dir so the cached artifact stays well under
      # the 10 GB Actions-cache budget shared with the Conan/Qt caches.
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "2G"

    steps:
      - name: Use HTTPS for github.com submodules
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # tags/describe need full history

      - name: Read versions.env
        # PJ_QT_VERSION / PJ_APP_VERSION are the single source of truth.
        # Filter to KEY=VALUE lines — GITHUB_ENV rejects '#' comments and blanks
        # verbatim, and versions.env carries a header comment.
        shell: bash
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' versions.env >> "$GITHUB_ENV"

      - name: Resolve installer version
        # Tag build -> the tag (without a leading 'v'); manual build -> PJ_APP_VERSION.
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            echo "PJ_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "PJ_VERSION=${PJ_APP_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Install Conan
        uses: conan-io/setup-conan@v1
        with:
          # Backed by ghcr.io via oras (see steps below) instead of
          # actions/cache (10 GB soft cap, 7-day eviction, branch-scoped).
          # ghcr.io public repos: unlimited storage, tags survive forever,
          # cross-branch.
          cache_packages: false

      - name: Install cmake and ninja
        run: pip install cmake ninja

      # ─────────────────────────── Conan cache: restore ───────────────────────────

      - name: Setup oras (OCI Registry As Storage)
        # Primary install path. continue-on-error so a 5xx on the github.com
        # release CDN doesn't kill CI — we have a fallback below, and worst
        # case we degrade to "no Conan cache this run" (build still completes).
        id: setup_oras
        uses: oras-project/setup-oras@v1
        with:
          version: "1.3.0"
        continue-on-error: true

      - name: Setup oras (manual download fallback)
        id: setup_oras_fallback
        if: steps.setup_oras.outcome == 'failure'
        continue-on-error: true
        shell: pwsh
        run: |
          $version = "1.3.0"
          $url = "https://github.com/oras-project/oras/releases/download/v$version/oras_${version}_windows_amd64.zip"
          $zip = Join-Path $env:RUNNER_TEMP "oras.zip"
          $installDir = Join-Path $env:RUNNER_TEMP "oras-bin"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $attempts = 0
          while ($attempts -lt 5) {
            try { Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing; break }
            catch {
              $attempts++
              if ($attempts -ge 5) { throw }
              Start-Sleep -Seconds ([math]::Pow(2, $attempts) * 5)
            }
          }
          Expand-Archive -Path $zip -DestinationPath $installDir -Force
          "$installDir" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Compute Conan cache tag
        # Cache identity = CACHE_VERSION salt + conanfile.txt hash. Bump the salt
        # to evict a poisoned cache. Shares the salt scheme with windows-ci.yml so
        # a release and CI run of the same conanfile hit the same OCI tag.
        id: conan_cache
        shell: pwsh
        run: |
          $cacheVersion = "v6"
          $fileHash = (Get-FileHash conanfile.txt -Algorithm SHA256).Hash.Substring(0, 16).ToLower()
          $hash = "$cacheVersion-$fileHash"
          $owner = "${{ github.repository_owner }}".ToLower()
          $tag = "ghcr.io/$owner/pj4-conan-cache:windows-msvc-relwithdebinfo-$hash"
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "restore_prefix=conan-windows-msvc-relwithdebinfo-$cacheVersion-" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Cache tag: $tag"

      - name: Login to ghcr.io
        if: github.repository_owner == 'PlotJuggler' && (steps.setup_oras.outcome == 'success' || steps.setup_oras_fallback.outcome == 'success')
        shell: pwsh
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:GHCR_TOKEN | oras login ghcr.io -u $env:GITHUB_ACTOR --password-stdin

      - name: Restore Conan cache from ghcr.io
        if: github.repository_owner == 'PlotJuggler' && (steps.setup_oras.outcome == 'success' || steps.setup_oras_fallback.outcome == 'success')
        shell: pwsh
        run: |
          $tag = "${{ steps.conan_cache.outputs.tag }}"
          $pullDir = Join-Path $env:RUNNER_TEMP "conan-cache-pull"
          New-Item -ItemType Directory -Force -Path $pullDir | Out-Null
          Push-Location $pullDir
          try {
            oras pull $tag 2>&1 | Out-Host
            $pulled = $LASTEXITCODE
          } finally { Pop-Location }
          $tarball = Join-Path $pullDir "conan-cache.tar.zst"
          if ($pulled -eq 0 -and (Test-Path $tarball)) {
            Write-Host "Cache HIT: extracting $tarball"
            New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.conan2" | Out-Null
            tar --zstd -xf $tarball -C $env:USERPROFILE
            "CONAN_CACHE_HIT=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "Cache MISS for $tag (cold start or first build of this conanfile)"
          }
          $global:LASTEXITCODE = 0

      - name: Restore Conan cache from GitHub Actions cache (fallback)
        # Skipped when ghcr.io already produced a HIT — %USERPROFILE%\.conan2 is
        # already populated. Fills the fork-build gap (no ghcr.io write there).
        id: conan-gha-cache
        if: env.CONAN_CACHE_HIT != '1'
        uses: actions/cache/restore@v5
        with:
          path: ~/.conan2
          key: conan-windows-msvc-relwithdebinfo-${{ steps.conan_cache.outputs.hash }}
          restore-keys: |
            ${{ steps.conan_cache.outputs.restore_prefix }}

      - name: Seed Conan source download cache
        # Some third-party source tarballs live on hosts that reject
        # GitHub-runner IPs (zlib.net → HTTP 415). Those are versioned in-repo
        # under .github/conan/source-backup/, addressed by sha256, and copied
        # into Conan's source download cache here so source() fetches are
        # served locally. Must run AFTER the Conan cache restores above (they
        # untar a full ~/.conan2 that would clobber the global.conf line
        # written here).
        shell: pwsh
        run: |
          $cacheDir = (Join-Path $env:RUNNER_TEMP "conan-source-cache").Replace('\', '/')
          New-Item -ItemType Directory -Force -Path "$cacheDir/s" | Out-Null
          if (Test-Path ".github/conan/source-backup") {
            Get-ChildItem ".github/conan/source-backup" -Exclude "README.md" |
              Copy-Item -Destination "$cacheDir/s"
          }
          $conanHome = (conan config home | Out-String).Trim()
          $conf = Join-Path $conanHome "global.conf"
          $lines = @()
          if (Test-Path $conf) {
            $lines = @(Get-Content $conf | Where-Object { $_ -notmatch '^core\.sources:download_cache=' })
          }
          $lines + "core.sources:download_cache=$cacheDir" | Set-Content $conf

      # ─────────────────────────── Qt cache: restore/install/save ───────────────────────────

      - name: Restore Qt cache
        id: qt-cache
        uses: actions/cache/restore@v5
        with:
          path: .qt
          key: qt-${{ env.PJ_QT_VERSION }}-windows-msvc2022_64-ifw

      - name: Verify Qt cache content
        # actions/cache can report cache-hit=true while the restored tree is
        # incomplete. Probe qmake.exe AND binarycreator.exe (this workflow needs
        # both) and force a reinstall on miss.
        id: qt-verify
        shell: bash
        run: |
          if [[ -x ".qt/${PJ_QT_VERSION}/msvc2022_64/bin/qmake.exe" ]] && \
             [[ -x ".qt/Tools/QtInstallerFramework/4.7/bin/binarycreator.exe" ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Qt (msvc) + Installer Framework via aqt
        if: steps.qt-cache.outputs.cache-hit != 'true' || steps.qt-verify.outputs.valid != 'true'
        shell: bash
        run: |
          # Released aqt can't fetch the current Windows Qt layout yet
          # (miurahr/aqtinstall#959/#1007); pin to the merged fix commit — same as
          # windows-ci.yml. Retry for transient mirror failures.
          pip install "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          attempt=0
          until aqt install-qt windows desktop "${PJ_QT_VERSION}" win64_msvc2022_64 --outputdir ./.qt; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then echo "aqt install-qt failed after ${attempt} attempts" >&2; exit 1; fi
            echo "aqt attempt ${attempt} failed; retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          # binarycreator for the installer step.
          aqt install-tool --outputdir ./.qt windows desktop tools_ifw

      - name: Save Qt cache
        # Immutable, version-keyed blob: saved once per Qt version. Save on any
        # completed install (dispatch or tag build).
        if: steps.qt-cache.outputs.cache-hit != 'true' || steps.qt-verify.outputs.valid != 'true'
        uses: actions/cache/save@v5
        with:
          path: .qt
          key: qt-${{ env.PJ_QT_VERSION }}-windows-msvc2022_64-ifw

      # ─────────────────────────── sccache: restore ───────────────────────────

      - name: Install sccache
        # sccache is a compile-cache speedup, NOT load-bearing: the build is
        # correct without it, just slower. So this step must never fail the run.
        id: setup_sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.8.2"

      - name: Restore sccache cache
        # Rolling per-SHA key + prefix restore-keys: each run restores the most
        # recent cache and the Save step persists a fresh superset.
        id: sccache-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-windows-msvc-relwithdebinfo-${{ github.sha }}
          restore-keys: |
            sccache-windows-msvc-relwithdebinfo-

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ─────────────────────────── Build ───────────────────────────

      - name: Conan install
        # Own step so the save-cache steps below can gate on ITS outcome: a
        # conan install that dies mid-graph must never publish its partial
        # ~/.conan2 as the cache blob.
        id: conan_install
        shell: bash
        run: |
          conan profile detect --force
          # cpython shared: its Conan recipe disables the static MSVC build (>=3.10),
          # so the embedded interpreter must link shared (Release CRT, matching the
          # RelWithDebInfo /MD graph). Ninja Multi-Config so sccache's compiler
          # launcher is honoured (VS/MSBuild ignores it).
          conan install . --output-folder=build --build=missing \
            -s build_type=RelWithDebInfo -s compiler.cppstd=20 \
            -o "cpython/*:shared=True" -s "cpython/*:build_type=Release" \
            -c tools.cmake.cmaketoolchain:generator="Ninja Multi-Config"

      - name: Build PlotJuggler 4 (app)
        shell: bash
        env:
          SCCACHE_AVAILABLE: ${{ steps.setup_sccache.outcome == 'success' }}
        run: |
          # CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded forces /Z7 (embedded)
          # over /Zi (shared PDB). /Zi writes via mspdbsrv.exe which sccache
          # cannot cache and which races between parallel cl.exe workers
          # (fatal C1041 on pj_base.pdb). Requires CMP0141=NEW.
          launcher_args=()
          if [[ "$SCCACHE_AVAILABLE" == "true" ]]; then
            launcher_args=(-DCMAKE_C_COMPILER_LAUNCHER=sccache \
                           -DCMAKE_CXX_COMPILER_LAUNCHER=sccache)
          else
            echo "::warning::sccache unavailable; building without a compiler cache"
          fi

          cmake -S . -B build -G "Ninja Multi-Config" \
            -DCMAKE_TOOLCHAIN_FILE="build/conan_toolchain.cmake" \
            -DCMAKE_PREFIX_PATH="$(pwd)/.qt/${PJ_QT_VERSION}/msvc2022_64" \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
            "${launcher_args[@]}"

          cmake --build build --config RelWithDebInfo --parallel

          if [[ "$SCCACHE_AVAILABLE" == "true" ]]; then
            sccache --show-stats
            sccache --stop-server || true
          fi

      - name: Check out pj-official-plugins (ported plugins source)
        # The script's default -PortedPluginsDir is <repo>\plotjuggler_sdk\pj_ported_plugins
        # (an internal workspace convention). In the client CI the plugins live in a
        # separate repo, so we clone it as a sibling and hand the path in below.
        uses: actions/checkout@v4
        with:
          repository: PlotJuggler/pj-official-plugins
          path: pj-official-plugins
          submodules: recursive

      - name: Publish plotjuggler_sdk to the local Conan cache from the submodule
        # Each ported plugin's conanfile requires plotjuggler_sdk/${SDK_VERSION}
        # (0.17.0 as of the current pin). Rather than depend on a Conan remote
        # (Conan Center only has 0.16.0 and cloudsmith needs credentials), we
        # build the SDK from source right here: the plotjuggler_sdk submodule is
        # already checked out at the tagged commit that CMake stamps as the
        # required version. `conan create` publishes it to the local cache with
        # that exact version, so the per-plugin `conan install` below resolves
        # it locally without touching any remote.
        shell: bash
        run: |
          conan create plotjuggler_sdk \
            --profile:host default --profile:build default \
            -s build_type=RelWithDebInfo -s compiler.cppstd=20 \
            --build=missing

      - name: Build the installer
        # The recipe builds the ported plugins (from source), stages the exe + Qt +
        # FFmpeg + CPython + plugins, and runs binarycreator. It auto-detects Qt/IFW
        # under .qt, activates MSVC, and locates ninja.
        shell: pwsh
        run: |
          .\installer\build_windows_installer.ps1 `
            -QtDir ".qt\$env:PJ_QT_VERSION\msvc2022_64" `
            -PortedPluginsDir "$env:GITHUB_WORKSPACE\pj-official-plugins" `
            -Version $env:PJ_VERSION `
            -OutDir dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlotJuggler-${{ env.PJ_VERSION }}-Windows-x64
          path: dist/PlotJuggler-*-Windows-x64.exe
          if-no-files-found: error

      - name: Attach installer to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/PlotJuggler-*-Windows-x64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

      # ─────────────────────────── Cache: save ───────────────────────────

      - name: Save sccache cache
        # Persist the now-warm compiler cache for the next run. always() so a
        # partial cache from a failed compile is still saved; cache-hit guard
        # skips the no-op save when this exact SHA's cache already exists.
        if: always() && steps.sccache-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-windows-msvc-relwithdebinfo-${{ github.sha }}

      - name: Save Conan cache to ghcr.io
        # Only push from the canonical repo on runs that got a clean conan
        # install (partial closure must never be persisted as the official
        # blob). Skip on cache HIT — the tag content is already up to date.
        if: |
          always() &&
          steps.conan_install.outcome == 'success' &&
          github.repository == 'PlotJuggler/PJ4' &&
          env.CONAN_CACHE_HIT != '1' &&
          (steps.setup_oras.outcome == 'success' || steps.setup_oras_fallback.outcome == 'success')
        shell: pwsh
        run: |
          $tag = "${{ steps.conan_cache.outputs.tag }}"
          $tarball = Join-Path $env:RUNNER_TEMP "conan-cache.tar.zst"
          # Trim build trees before packing so the uploaded artifact only
          # contains the package binaries consumers actually need.
          conan cache clean "*" --build --source --temp
          Write-Host "Packing ~/.conan2 -> $tarball"
          tar --zstd -cf $tarball -C $env:USERPROFILE .conan2
          $size = (Get-Item $tarball).Length / 1MB
          Write-Host ("Compressed cache size: {0:N1} MB" -f $size)
          Push-Location $env:RUNNER_TEMP
          try {
            oras push $tag "conan-cache.tar.zst:application/vnd.oci.image.layer.v1.tar+zstd"
          } finally { Pop-Location }

      - name: Trim Conan cache before GHA save
        if: always() && steps.conan_install.outcome == 'success' && env.CONAN_CACHE_HIT != '1' && steps.conan-gha-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: conan cache clean "*" --build --source --temp; $global:LASTEXITCODE = 0

      - name: Save Conan cache to GitHub Actions cache
        # Persist under the exact conanfile hash so later runs restore it.
        # Gated on a clean conan install (a mid-graph death must not persist a
        # partial closure). Skipped on ghcr.io HIT or exact GHA-key hit.
        if: always() && steps.conan_install.outcome == 'success' && env.CONAN_CACHE_HIT != '1' && steps.conan-gha-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.conan2
          key: conan-windows-msvc-relwithdebinfo-${{ steps.conan_cache.outputs.hash }}
