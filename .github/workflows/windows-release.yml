name: Release Windows Installer

# Builds the PlotJuggler 4 Windows installer (.exe) on a clean windows-2022 runner
# and, on a version tag, attaches it to the GitHub Release. The Windows sibling of
# release.yml (which does the Linux AppImage).
#
# Official plugins are built and published independently. This workflow resolves
# the curated Windows set from pj-plugin-registry, verifies every artifact, and
# proves every DLL loads in the staged app before creating the installer.
#
# Cache/repository layers shared with windows-ci.yml:
#   - Qt kit via actions/cache
#   - sccache via actions/cache (585 TU compiler cache)
#   - Conan packages via PlotJuggler's JFrog repository, then ConanCenter
#
# Triggers:
#   - workflow_dispatch -> build the installer from any branch (artifact only)
#   - push of a `v*` tag -> build + attach the installer to that tag's Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write     # softprops/action-gh-release needs write to create/update the Release

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    # Match windows-ci.yml and the toolchain used for the published plugin artifacts.
    runs-on: windows-2022
    # Backstop against hangs — app build plus registry download/validation/packaging.
    # Plugins are not compiled here.
    timeout-minutes: 180

    env:
      # Pin sccache's object cache to a known path so actions/cache can persist
      # it across runs (see the "Restore/Save sccache cache" steps). Without a
      # persisted cache, sccache's local disk starts empty every run — a 0% hit
      # rate that forces all ~585 translation units to recompile cold (~30 min).
      # SCCACHE_CACHE_SIZE bounds the dir so the cached artifact stays well under
      # the Actions-cache budget shared with the Qt cache.
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "2G"

    steps:
      - name: Use HTTPS for github.com submodules
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # tags/describe need full history

      - name: Read versions.env
        # PJ_QT_VERSION / PJ_APP_VERSION are the single source of truth.
        # Filter to KEY=VALUE lines — GITHUB_ENV rejects '#' comments and blanks
        # verbatim, and versions.env carries a header comment.
        shell: bash
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' versions.env >> "$GITHUB_ENV"

      - name: Resolve installer version
        # Tag build -> the tag (without a leading 'v'); manual build -> PJ_APP_VERSION.
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            echo "PJ_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "PJ_VERSION=${PJ_APP_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Install Conan
        uses: conan-io/setup-conan@v1
        with:
          # Packages are resolved and published through JFrog below. Avoid
          # duplicating the complete ~/.conan2 directory in Actions cache.
          cache_packages: false

      - name: Install cmake and ninja
        run: pip install cmake ninja

      - name: Set up MSVC environment
        # Conan's package ID includes the detected compiler settings, so activate
        # MSVC before detecting the profile or resolving Artifactory binaries.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ─────────────────────────── Conan repository ───────────────────────────

      - name: Configure JFrog Conan repository
        id: conan_remote
        shell: bash
        env:
          JFROG_USER: ${{ vars.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$JFROG_USER" || -z "$JFROG_TOKEN" ]]; then
            echo "::error::Configure the JFROG_USER Actions variable and JFROG_TOKEN Actions secret."
            exit 1
          fi
          conan remote add plotjuggler-conan \
            "https://plotjuggler.jfrog.io/artifactory/api/conan/plotjuggler-conan" \
            --force --index=0
          conan remote login plotjuggler-conan "$JFROG_USER" -p "$JFROG_TOKEN"
          echo "PJ_USE_JFROG=true" >> "$GITHUB_ENV"
          echo "authenticated=true" >> "$GITHUB_OUTPUT"
          conan remote list

      - name: Seed Conan source download cache
        # Some third-party source tarballs live on hosts that reject
        # GitHub-runner IPs (zlib.net → HTTP 415). Those are versioned in-repo
        # under .github/conan/source-backup/, addressed by sha256, and copied
        # into Conan's source download cache here so source() fetches are
        # served locally. The source cache is separate from the binary packages
        # resolved through Artifactory.
        shell: pwsh
        run: |
          $cacheDir = (Join-Path $env:RUNNER_TEMP "conan-source-cache").Replace('\', '/')
          New-Item -ItemType Directory -Force -Path "$cacheDir/s" | Out-Null
          if (Test-Path ".github/conan/source-backup") {
            Get-ChildItem ".github/conan/source-backup" -Exclude "README.md" |
              Copy-Item -Destination "$cacheDir/s"
          }
          $conanHome = (conan config home | Out-String).Trim()
          $conf = Join-Path $conanHome "global.conf"
          $lines = @()
          if (Test-Path $conf) {
            $lines = @(Get-Content $conf | Where-Object { $_ -notmatch '^core\.sources:download_cache=' })
          }
          $lines + "core.sources:download_cache=$cacheDir" | Set-Content $conf

      # ─────────────────────────── Qt cache: restore/install/save ───────────────────────────

      - name: Restore Qt cache
        id: qt-cache
        uses: actions/cache/restore@v5
        with:
          path: .qt
          key: qt-${{ env.PJ_QT_VERSION }}-windows-msvc2022_64-ifw

      - name: Verify Qt cache content
        # actions/cache can report cache-hit=true while the restored tree is
        # incomplete. Probe qmake.exe AND binarycreator.exe (this workflow needs
        # both) and force a reinstall on miss.
        id: qt-verify
        shell: bash
        run: |
          if [[ -x ".qt/${PJ_QT_VERSION}/msvc2022_64/bin/qmake.exe" ]] && \
             [[ -x ".qt/Tools/QtInstallerFramework/4.7/bin/binarycreator.exe" ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Qt (msvc) + Installer Framework via aqt
        if: steps.qt-cache.outputs.cache-hit != 'true' || steps.qt-verify.outputs.valid != 'true'
        shell: bash
        run: |
          # Released aqt can't fetch the current Windows Qt layout yet
          # (miurahr/aqtinstall#959/#1007); pin to the merged fix commit — same as
          # windows-ci.yml. Retry for transient mirror failures.
          pip install "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          attempt=0
          until aqt install-qt windows desktop "${PJ_QT_VERSION}" win64_msvc2022_64 --outputdir ./.qt; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then echo "aqt install-qt failed after ${attempt} attempts" >&2; exit 1; fi
            echo "aqt attempt ${attempt} failed; retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          # binarycreator for the installer step.
          aqt install-tool --outputdir ./.qt windows desktop tools_ifw

      - name: Save Qt cache
        # Immutable, version-keyed blob: saved once per Qt version. Save on any
        # completed install (dispatch or tag build).
        if: steps.qt-cache.outputs.cache-hit != 'true' || steps.qt-verify.outputs.valid != 'true'
        uses: actions/cache/save@v5
        with:
          path: .qt
          key: qt-${{ env.PJ_QT_VERSION }}-windows-msvc2022_64-ifw

      # ─────────────────────────── sccache: restore ───────────────────────────

      - name: Install sccache
        # sccache is a compile-cache speedup, NOT load-bearing: the build is
        # correct without it, just slower. So this step must never fail the run.
        id: setup_sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.8.2"

      - name: Restore sccache cache
        # Rolling per-SHA key + prefix restore-keys: each run restores the most
        # recent cache and the Save step persists a fresh superset.
        id: sccache-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-windows-msvc-relwithdebinfo-${{ github.sha }}
          restore-keys: |
            sccache-windows-msvc-relwithdebinfo-

      # ─────────────────────────── Build ───────────────────────────

      - name: Conan install
        # Search the authenticated JFrog repository first, then public
        # ConanCenter for packages that have not been uploaded yet.
        id: conan_install
        shell: bash
        run: |
          conan profile detect --force
          # cpython shared: its Conan recipe disables the static MSVC build (>=3.10),
          # so the embedded interpreter must link shared (Release CRT, matching the
          # RelWithDebInfo /MD graph). Ninja Multi-Config so sccache's compiler
          # launcher is honoured (VS/MSBuild ignores it).
          conan_remotes=(-r=plotjuggler-conan -r=conancenter)
          conan_log="${RUNNER_TEMP}/pj4-conan-install.log"
          conan install . --output-folder=build --build=missing "${conan_remotes[@]}" \
            -s build_type=RelWithDebInfo -s compiler.cppstd=20 \
            -o "cpython/*:shared=True" -s "cpython/*:build_type=Release" \
            -c tools.cmake.cmaketoolchain:generator="Ninja Multi-Config" \
            2>&1 | tee "$conan_log"
          if grep -q "Building from source" "$conan_log"; then
            echo "::notice::Conan built missing binaries; they will be published to JFrog."
          fi

      - name: Publish Conan packages to JFrog
        if: steps.conan_install.outcome == 'success'
        shell: bash
        run: |
          # Existing revisions are skipped. Seed both ConanCenter downloads and
          # binaries built by --build=missing for the next Windows job.
          conan upload "*" -r=plotjuggler-conan --confirm \
            -cc core.upload:parallel=4

      - name: Build PlotJuggler 4 (app)
        shell: bash
        env:
          SCCACHE_AVAILABLE: ${{ steps.setup_sccache.outcome == 'success' }}
        run: |
          # CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded forces /Z7 (embedded)
          # over /Zi (shared PDB). /Zi writes via mspdbsrv.exe which sccache
          # cannot cache and which races between parallel cl.exe workers
          # (fatal C1041 on pj_base.pdb). Requires CMP0141=NEW.
          launcher_args=()
          if [[ "$SCCACHE_AVAILABLE" == "true" ]]; then
            launcher_args=(-DCMAKE_C_COMPILER_LAUNCHER=sccache \
                           -DCMAKE_CXX_COMPILER_LAUNCHER=sccache)
          else
            echo "::warning::sccache unavailable; building without a compiler cache"
          fi

          cmake -S . -B build -G "Ninja Multi-Config" \
            -DCMAKE_TOOLCHAIN_FILE="build/conan_toolchain.cmake" \
            -DCMAKE_PREFIX_PATH="$(pwd)/.qt/${PJ_QT_VERSION}/msvc2022_64" \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
            "${launcher_args[@]}"

          # This release only packages the application. Building the default ALL
          # target also compiles the repository's test executables, which are not
          # consumed by the installer and needlessly delays the registry smoke test.
          cmake --build build --config RelWithDebInfo --target pj_app --parallel

          if [[ "$SCCACHE_AVAILABLE" == "true" ]]; then
            sccache --show-stats
            sccache --stop-server || true
          fi

      - name: Build the installer
        # The recipe stages the app, downloads the curated published plugins from
        # the registry, verifies checksums + manifests, loads every whitelisted DLL
        # through the real host runtime, then runs binarycreator. Any plugin failure
        # fails the release; there are no best-effort skips.
        shell: pwsh
        run: |
          .\installer\build_windows_installer.ps1 `
            -QtDir ".qt\$env:PJ_QT_VERSION\msvc2022_64" `
            -PluginRegistryUrl "https://raw.githubusercontent.com/PlotJuggler/pj-plugin-registry/refs/heads/development/registry.json" `
            -Version $env:PJ_VERSION `
            -OutDir dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlotJuggler-${{ env.PJ_VERSION }}-Windows-x64
          path: dist/*.PlotJuggler-*-Windows-x64.*.exe
          if-no-files-found: error

      - name: Attach installer to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.PlotJuggler-*-Windows-x64.*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

      # ─────────────────────────── Compiler cache: save ───────────────────────────

      - name: Save sccache cache
        # Persist the now-warm compiler cache for the next run. always() so a
        # partial cache from a failed compile is still saved; cache-hit guard
        # skips the no-op save when this exact SHA's cache already exists.
        if: always() && steps.sccache-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-windows-msvc-relwithdebinfo-${{ github.sha }}
