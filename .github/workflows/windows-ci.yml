name: Windows CI

on:
  pull_request:
    branches: [main, development]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs only. Push-to-main runs publish any Conan
  # binaries built from source to Artifactory for subsequent jobs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/pre-commit.yml
    permissions:
      contents: read

  build:
    if: github.event.pull_request.draft == false
    needs: pre-commit
    runs-on: windows-latest
    # PJ4 v1 is Linux-only by policy (see CLAUDE.md). This job runs as a
    # portability tracker: it surfaces POSIX-isms early without blocking
    # PRs while the codebase converges on cross-platform cleanliness.
    continue-on-error: true
    # Backstop against hangs (a deadlocked test otherwise holds the runner for
    # GitHub's 6-hour default). A first run can still rebuild a missing Conan
    # closure from source before publishing it to Artifactory, then compile the
    # app with a cold sccache. Keep enough margin for that bootstrap case.
    # 150 leaves margin over that while still catching real hangs.
    timeout-minutes: 150
    permissions:
      contents: read

    env:
      # Share object-level MSVC results with the release and Pixi workflows.
      # Unlike a per-commit actions/cache archive, the native backend stores and
      # retrieves individual compilation results without rolling 800+ MB blobs.
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_VERSION: "pj4-windows-msvc-relwithdebinfo-v1"

    steps:
      - name: Use HTTPS for github.com submodules
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source ./versions.env
          echo "PJ_APP_VERSION=${PJ_APP_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_QT_VERSION=${PJ_QT_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_APPIMAGE_ARCH=${PJ_APPIMAGE_ARCH}" >> "${GITHUB_ENV}"
          echo "app_version=${PJ_APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "qt_version=${PJ_QT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "appimage_arch=${PJ_APPIMAGE_ARCH}" >> "${GITHUB_OUTPUT}"

      - uses: conan-io/setup-conan@v1
        with:
          # Third-party binaries are resolved from the PlotJuggler JFrog local
          # repository first, with ConanCenter as fallback. Do not also archive
          # ~/.conan2 in Actions cache.
          cache_packages: false

      - name: Setup MSVC environment
        # Conan's package ID includes the detected compiler settings, so activate
        # MSVC before detecting the profile or resolving Artifactory binaries.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure public Conan repository for pull requests
        if: github.event_name == 'pull_request' || github.repository != 'PlotJuggler/PJ4'
        shell: bash
        run: |
          # Never expose the deploy-capable JFrog credential to pull-request or
          # fork-controlled workflow code. These jobs may build missing public
          # packages but cannot publish them.
          echo "PJ_USE_JFROG=false" >> "$GITHUB_ENV"

      - name: Configure JFrog Conan repository
        if: github.event_name != 'pull_request' && github.repository == 'PlotJuggler/PJ4'
        id: conan_remote
        shell: bash
        env:
          # Prefer the non-sensitive Actions variable, but also support
          # organizations that provision both JFrog values as secrets.
          JFROG_USER: ${{ vars.JFROG_USER || secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$JFROG_USER" || -z "$JFROG_TOKEN" ]]; then
            echo "::error::Configure JFROG_USER as an Actions variable or secret, and JFROG_TOKEN as an Actions secret."
            exit 1
          fi

          conan remote add plotjuggler-conan \
            "https://plotjuggler.jfrog.io/artifactory/api/conan/plotjuggler-conan" \
            --force --index=0
          conan remote login plotjuggler-conan "$JFROG_USER" -p "$JFROG_TOKEN"
          echo "PJ_USE_JFROG=true" >> "$GITHUB_ENV"
          echo "authenticated=true" >> "$GITHUB_OUTPUT"
          conan remote list

      - name: Seed Conan source download cache
        # Some third-party source tarballs live on hosts that reject
        # GitHub-runner IPs (zlib.net answers HTTP 415; minizip — a hard
        # requirement of assimp — downloads zlib's tarball from there and has
        # no mirror in its recipe). Those tarballs are versioned in-repo under
        # .github/conan/source-backup/, addressed by sha256, and copied into
        # Conan's source download cache here so a source() fetch is served
        # locally and never touches the flaky host. Conan still verifies the
        # recipe-pinned sha256 on every use, and anything not seeded falls
        # through to the recipe's own URLs as usual. (An HTTP backup via
        # raw.githubusercontent does NOT work here: this repo is private, so
        # unauthenticated raw fetches 404.) See
        # .github/conan/source-backup/README.md.
        #
        # The write is idempotent so repeated local runs do not accumulate
        # duplicate core.sources:download_cache entries.
        shell: pwsh
        run: |
          $cacheDir = (Join-Path $env:RUNNER_TEMP "conan-source-cache").Replace('\', '/')
          New-Item -ItemType Directory -Force -Path "$cacheDir/s" | Out-Null
          Get-ChildItem ".github/conan/source-backup" -Exclude "README.md" |
            Copy-Item -Destination "$cacheDir/s"
          $conanHome = (conan config home | Out-String).Trim()
          $conf = Join-Path $conanHome "global.conf"
          $lines = @()
          if (Test-Path $conf) {
            $lines = @(Get-Content $conf | Where-Object { $_ -notmatch '^core\.sources:download_cache=' })
          }
          $lines + "core.sources:download_cache=$cacheDir" | Set-Content $conf
          # Surface the effective conf in the log so a clobber regression is
          # visible at a glance.
          Get-Content $conf

      - name: Restore Qt SDK cache
        # Split restore/save (not actions/cache) so the entry is written by an
        # explicit step right after the install instead of a post-job save:
        # push-to-main only, to keep this multi-hundred-MB blob from being
        # duplicated across PR refs (shared 10 GB budget), and never capturing
        # a tree mutated by later steps.
        id: qt-sdk-cache
        uses: actions/cache/restore@v5
        with:
          # Must match windows-release.yml exactly: cache versions include the
          # path as well as the key.
          path: .qt/${{ steps.versions.outputs.qt_version }}/msvc2022_64
          key: qt-sdk-${{ steps.versions.outputs.qt_version }}-windows-msvc2022_64-v1

      - name: Verify Qt cache content
        # actions/cache can report cache-hit=true while the restored tree is
        # incomplete (interrupted Save, partial eviction). Without this guard
        # the next step skips aqtinstall and the Configure step then fails with
        # "Qt not found at $QT_DIR". Probe qmake.exe (the artifact the
        # rest of the pipeline actually needs) and force a reinstall on miss.
        id: qt-sdk-verify
        shell: bash
        run: |
          if [[ -x ".qt/${PJ_QT_VERSION}/msvc2022_64/bin/qmake.exe" ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Qt via aqt
        # Inline (not install_qt6.sh): that script is Linux-only (gcc_64); this
        # job needs the win64_msvc2022_64 build. The version comes from versions.env.
        if: steps.qt-sdk-verify.outputs.valid != 'true'
        shell: bash
        run: |
          # Released aqt (<=3.3.0) can't install the pinned Qt on Windows: Qt moved
          # the Windows repo to per-arch folders and released aqt still requests
          # the old nested path (miurahr/aqtinstall#959 / #1007), failing with
          # "Failed to locate XML data for Qt version". The fix (PR #1000)
          # is merged but unreleased, so pin to that merge commit.
          # TODO: revert to `pip install 'aqtinstall>=3.3.1'` once it ships.
          pip install "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          # Retry with backoff for transient mirror failures.
          rm -rf ".qt/${PJ_QT_VERSION}/msvc2022_64"
          attempt=0
          until aqt install-qt windows desktop "${PJ_QT_VERSION}" win64_msvc2022_64 --outputdir ./.qt; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then echo "aqt failed after ${attempt} attempts" >&2; exit 1; fi
            echo "aqt attempt ${attempt} failed (transient mirror?); retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done

      - name: Save Qt SDK cache
        # Immutable, version-keyed blob: saved once per Qt version, from a
        # push-to-main run (see the restore step's comment for why not per-PR).
        if: github.event_name == 'push' && steps.qt-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .qt/${{ steps.versions.outputs.qt_version }}/msvc2022_64
          key: qt-sdk-${{ steps.versions.outputs.qt_version }}-windows-msvc2022_64-v1

      - name: Install sccache
        # sccache is a compile-cache speedup, NOT load-bearing: the build is
        # correct without it, just slower. So this step must never fail the run.
        # v0.16 supports GitHub's current cache service; the action exports its
        # short-lived runtime credentials. The outcome gate in Build keeps this
        # optional if installation itself flakes.
        id: setup_sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: Conan install
        # Search PlotJuggler's shared JFrog package store first, then use public
        # ConanCenter for anything not uploaded yet. Pull requests use only the
        # public fallback and never publish.
        id: conan_install
        shell: bash
        run: |
          conan profile detect --force
          # Tell Conan to generate a Ninja-compatible toolchain. Without this
          # override Conan auto-picks "Visual Studio 17 2022" and stamps the
          # toolchain with CMAKE_GENERATOR_PLATFORM=x64 + CMAKE_GENERATOR_TOOLSET=v143.
          # Then our `cmake -G "Ninja Multi-Config"` below errors with:
          #   Generator Ninja Multi-Config does not support platform specification,
          #   but platform x64 was specified.
          # CPython's Conan recipe disables the STATIC MSVC build (>=3.10), so the
          # embedded Python backend (pj_scripting) must link it shared here. CPython's
          # MSVC build (PCbuild.sln) also has no "RelWithDebInfo" configuration — only
          # Debug/Release — so build just that dependency as Release. Release is
          # CRT-compatible with the rest of the RelWithDebInfo graph (both use the
          # release /MD runtime). Both overrides are scoped to cpython only and
          # Windows-CI-only; Linux links CPython statically.
          conan_remotes=(-r=conancenter)
          if [[ "$PJ_USE_JFROG" == "true" ]]; then
            bash .github/scripts/sync-conan-recipes.sh \
              -s build_type=RelWithDebInfo -s compiler.cppstd=20 \
              -o "cpython/*:shared=True" -s "cpython/*:build_type=Release" \
              -c tools.cmake.cmaketoolchain:generator="Ninja Multi-Config"
            conan_remotes=(-r=plotjuggler-conan -r=conancenter)
          fi
          conan_log="${RUNNER_TEMP}/pj4-conan-install.log"
          conan install . --output-folder=build --build=missing "${conan_remotes[@]}" \
            -s build_type=RelWithDebInfo -s compiler.cppstd=20 \
            -o "cpython/*:shared=True" -s "cpython/*:build_type=Release" \
            -c tools.cmake.cmaketoolchain:generator="Ninja Multi-Config" \
            2>&1 | tee "$conan_log"
          if grep -q "Building from source" "$conan_log"; then
            echo "::notice::Conan built missing binaries; trusted jobs will publish them to JFrog."
          fi

      - name: Publish Conan packages to JFrog
        if: steps.conan_install.outcome == 'success' && steps.conan_remote.outputs.authenticated == 'true'
        shell: bash
        run: |
          # Conan compares recipe/package revisions and skips artifacts already
          # present in JFrog. This seeds both ConanCenter downloads and binaries
          # built by --build=missing for the next trusted Windows job.
          conan upload "*" -r=plotjuggler-conan --confirm \
            -cc core.upload:parallel=4

      - name: Build
        shell: bash
        env:
          # "true" only if the install step actually succeeded; gates the
          # compiler-launcher wiring below so a flaked sccache install degrades
          # to an uncached (but correct) build instead of failing.
          SCCACHE_AVAILABLE: ${{ steps.setup_sccache.outcome == 'success' }}
        run: |
          QT_DIR="$(pwd)/.qt/${PJ_QT_VERSION}/msvc2022_64"
          if [[ ! -d "$QT_DIR" ]]; then
            echo "::error::Qt ${PJ_QT_VERSION} not found at $QT_DIR"
            exit 1
          fi

          # Use Ninja Multi-Config so sccache is actually invoked: CMake's
          # CMAKE_<LANG>_COMPILER_LAUNCHER is honored by the Ninja and
          # Makefile generators only — the Visual Studio (MSBuild) generator
          # silently ignores it, which is why prior runs showed "Compile
          # requests: 0" in sccache --show-stats.
          #
          # CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded forces /Z7 instead
          # of /Zi for RelWithDebInfo. /Zi writes to a shared PDB via
          # mspdbsrv.exe which sccache cannot cache; /Z7 embeds debug info
          # in each .obj and is fully cacheable.
          #
          # CMAKE_POLICY_DEFAULT_CMP0141=NEW is required for CMake to honor
          # CMAKE_MSVC_DEBUG_INFORMATION_FORMAT at all. The variable was added
          # in CMake 3.25 behind policy CMP0141; without NEW, CMake silently
          # falls back to the legacy /Zi flag — which is what causes parallel
          # cl.exe workers to race on pj_base.pdb (fatal C1041). We can't bump
          # cmake_minimum_required past 3.22 because Ubuntu 22.04 LTS ships
          # CMake 3.22.1, so the opt-in lives here in the CI invocation.
          # Only route the compiler through sccache if its install succeeded.
          # /Z7 (Embedded debug info) below stays on regardless: it also avoids
          # the parallel-cl.exe pj_base.pdb race, so it's correct with or
          # without the cache.
          launcher_args=()
          if [[ "$SCCACHE_AVAILABLE" == "true" ]]; then
            launcher_args=(-DCMAKE_C_COMPILER_LAUNCHER=sccache \
                           -DCMAKE_CXX_COMPILER_LAUNCHER=sccache)
          else
            echo "::warning::sccache unavailable; building without a compiler cache"
          fi

          cmake -S . -B build -G "Ninja Multi-Config" \
            -DCMAKE_TOOLCHAIN_FILE="build/conan_toolchain.cmake" \
            -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
            "${launcher_args[@]}"

          cmake --build build --config RelWithDebInfo --parallel

          # Surface sccache stats before the post-action does, so they
          # appear in the Build step's log next to the compile output.
          if [[ "$SCCACHE_AVAILABLE" == "true" ]]; then
            sccache --show-stats
          fi

      - name: Test
        # Prepend Qt's and FFmpeg's bin/ dirs to PATH so the OS loader can resolve
        # their DLLs (Qt6Core.dll, avcodec/avformat/avutil/swscale) when ctest
        # launches the test executables. Without this they exit 0xC0000135
        # (STATUS_DLL_NOT_FOUND) before any test code runs.
        shell: bash
        run: |
          export PATH="$(pwd)/.qt/${PJ_QT_VERSION}/msvc2022_64/bin:$PATH"
          # FFmpeg's Conan bin dir(s) are emitted at configure time by
          # pj_scene2D/core/CMakeLists.txt (Conan's package path is hashed and not
          # knowable here). Prepend each so every exe that transitively links
          # pj_scene2d_core resolves the FFmpeg DLLs — covers all such tests at once,
          # no per-target list.
          #
          # DEFERRED: a shipped Windows pj_app.exe needs these same 4 DLLs at startup.
          # PJ4 v1 is Linux-only and this job is a non-blocking portability tracker,
          # so real packaging (windeployqt + bundling the FFmpeg DLLs via CPack/
          # install) is intentionally NOT done here. Wire that up when Windows
          # becomes a supported release target.
          if [[ -f build/pj_ffmpeg_bin_dirs.txt ]]; then
            while IFS= read -r _d; do
              [[ -n "$_d" ]] && export PATH="$(cygpath -u "$_d"):$PATH"
            done < build/pj_ffmpeg_bin_dirs.txt
          fi
          # CPython runtime dir (pythonXY.dll) for python_engine_test — emitted by
          # pj_scripting/CMakeLists.txt when cpython is built shared (Windows only).
          # Same rationale as the FFmpeg dirs above.
          if [[ -f build/pj_python_bin_dirs.txt ]]; then
            while IFS= read -r _d; do
              [[ -n "$_d" ]] && export PATH="$(cygpath -u "$_d"):$PATH"
            done < build/pj_python_bin_dirs.txt
          fi
          # --timeout kills any single test after 2 min so a deadlocked test
          # fails loudly with its name in the log instead of stalling the job.
          ctest --test-dir build --build-config RelWithDebInfo --output-on-failure --timeout 120
