name: Release AppImage

# Builds the portable Linux AppImage and, on a version tag, attaches it to the
# GitHub Release. Modeled on PlotJuggler 3's ubuntu.yaml release job, adapted to
# PJ4's heavier setup (Qt from aqt into ./.qt, deps from Conan) — so it reuses
# the same Qt/Conan/ccache caching that linux-ci.yml relies on.
#
# Trigger: workflow_dispatch only — build an AppImage from any branch (artifact
# only; attaches to a Release only when dispatched on a tag ref). The `v*` tag
# trigger moved to linux-appimage-release.yml, the authoritative release build:
# both workflows produced the SAME asset name (PlotJuggler-<tag>-x86_64.AppImage)
# and raced to attach it to the tag's Release. This lighter registry-driven
# flavor is kept for packaging smoke tests.
on:
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release needs write to create/update the Release

jobs:
  appimage:
    runs-on: depot-ubuntu-22.04-4
    steps:
      - name: Use HTTPS for github.com submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source ./versions.env
          echo "PJ_APP_VERSION=${PJ_APP_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_QT_VERSION=${PJ_QT_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_APPIMAGE_ARCH=${PJ_APPIMAGE_ARCH}" >> "${GITHUB_ENV}"
          echo "app_version=${PJ_APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "qt_version=${PJ_QT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "appimage_arch=${PJ_APPIMAGE_ARCH}" >> "${GITHUB_OUTPUT}"

      - name: Select release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${PJ_APP_VERSION:-4.0.0-dev}"
          fi
          echo "PJ_VERSION=${version}" >> "${GITHUB_ENV}"

      - uses: conan-io/setup-conan@v1
        with:
          cache_packages: false

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          # Keyed on the dependency manifests; partial reuse via the prefix.
          key: conan-appimage-${{ hashFiles('**/conanfile.txt') }}
          restore-keys: conan-appimage-

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v5
        with:
          path: .qt
          key: qt-${{ steps.versions.outputs.qt_version }}-linux-gcc_64

      - name: Install Qt via aqt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: ./install_qt6.sh   # reads versions.env; installs into ./.qt; no-ops if already present

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libva-dev / libdrm-dev: required by the FFmpeg Conan build (VAAPI).
          # wget/file: linuxdeploy fetch + ELF inspection.
          # unzip: --plugins-registry unpacks the downloaded plugin zips (python3
          #        + sha256sum for registry parse/verify are already on the runner).
          sudo apt-get install -y --no-install-recommends \
            libva-dev libdrm-dev \
            wget file unzip ccache zstd

      - name: Configure ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-appimage-${{ github.sha }}
          restore-keys: ccache-appimage-

      - name: Build plotjuggler4
        # Tests/demos never ship and this flow runs no ctest; skip their
        # ~271 uncacheable links and ~17 GB of build tree.
        env:
          PJ_BUILD_TESTS: "OFF"
          PJ_BUILD_DEMOS: "OFF"
        run: ./build.sh

      - name: Build AppImage
        env:
          # The linuxdeploy tools are themselves AppImages; ubuntu-22.04 runners no
          # longer ship libfuse2, so run them extracted instead of FUSE-mounted.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          # --plugins-registry: download the curated official plugin set (BUNDLE_IDS)
          # from pj-plugin-registry (main), verify checksums, unpack into the bundle.
          # Fails the release if any curated plugin can't be resolved/downloaded.
          bash appimage/build_appimage.sh --plugins-registry
          echo "APPIMAGE=appimage/PlotJuggler-${PJ_VERSION}-${PJ_APPIMAGE_ARCH}.AppImage" >> "${GITHUB_ENV}"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlotJuggler-${{ env.PJ_VERSION }}-${{ env.PJ_APPIMAGE_ARCH }}.AppImage
          path: ${{ env.APPIMAGE }}
          if-no-files-found: error

      - name: Attach AppImage to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APPIMAGE }}
          generate_release_notes: true
          fail_on_unmatched_files: true
