name: Release AppImage (embedded plugins)

# Builds the release-quality PlotJuggler 4 AppImage — the app + curated plugins
# EMBEDDED BY COMPILATION (not downloaded from the registry) via
# appimage/build_release_appimage.sh. The Linux sibling of windows-release.yml
# (which does the Windows installer). Uses the Docker builder that ships with
# the repo (Ubuntu 22.04 / glibc 2.35 floor) so the AppImage runs on any distro
# with glibc >= 2.35.
#
# Triggers:
#   - workflow_dispatch  -> build from any branch (artifact only, no Release upload)
#   - push of a `v*` tag -> build + attach the AppImage to that tag's Release
#
# Complements the pre-existing release.yml, which builds a lighter registry-driven
# AppImage. Kept as a separate file so a dispatched release build never races the
# registry-download variant on the same trigger.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # softprops/action-gh-release needs write to create/update the Release

concurrency:
  group: linux-appimage-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-appimage:
    runs-on: ubuntu-22.04
    # A full cold Docker build compiles ffmpeg / arrow / grpc from source once,
    # so the first pass is slow; the persistent Conan + ccache Docker volumes make
    # subsequent runs much faster. 360 minutes covers the cold path with margin.
    timeout-minutes: 360

    steps:
      - name: Free up disk space on the runner
        # ubuntu-22.04 runners ship with ~14 GB free; the release AppImage build
        # (Docker builder image + Conan cache + FFmpeg/Arrow/gRPC + PJ4 core +
        # the 13 curated plugins + ROS 2 multi-distro bundles) fills it up. The
        # first cold run hit `ar: libpj_datastore.a: No space left on device`
        # mid-compile. Drop ~30 GB of preinstalled toolchains we do not need
        # (Android, .NET, Haskell, big Docker base images) up front.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Use HTTPS for github.com submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch pj-official-plugins into plotjuggler_sdk/pj_ported_plugins
        # build_release_appimage.sh expects plotjuggler_sdk/pj_ported_plugins to
        # be a full pj-official-plugins checkout (with its build.sh and the
        # data_stream_ros2/docker/run-local.sh ROS 2 orchestrator). It is not a
        # git submodule of plotjuggler_sdk on this repo, so `submodules: recursive`
        # above does not bring it in. Clone it explicitly at the tip of main so
        # the released AppImage embeds the latest curated plugin set.
        shell: bash
        run: |
          set -euo pipefail
          target="plotjuggler_sdk/pj_ported_plugins"
          if [[ -d "$target/.git" || -f "$target/build.sh" ]]; then
            echo "$target already populated — skipping clone."
            exit 0
          fi
          rm -rf "$target"
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/PlotJuggler/pj-official-plugins.git "$target"

      - name: Read versions.env
        # PJ_APP_VERSION / PJ_QT_VERSION / PJ_APPIMAGE_ARCH are the single source
        # of truth for the version and architecture stamp in the artifact name.
        # `source` (not `cat`) so bash strips the comments in versions.env
        # before we forward the values to $GITHUB_ENV, which only accepts KEY=VALUE.
        shell: bash
        run: |
          set -euo pipefail
          source ./versions.env
          echo "PJ_APP_VERSION=${PJ_APP_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_QT_VERSION=${PJ_QT_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_APPIMAGE_ARCH=${PJ_APPIMAGE_ARCH}" >> "${GITHUB_ENV}"

      - name: Resolve release version
        # Tag build -> the tag verbatim; manual dispatch -> PJ_APP_VERSION from
        # versions.env so the artifact name still carries a meaningful version.
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            echo "PJ_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "PJ_VERSION=${PJ_APP_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Persist Docker layer cache
        # The orchestrator's builder image (appimage/Dockerfile.build) is stable
        # across runs; keep its layers in /var/lib/docker between invocations.
        # Not required for correctness, but a full cold pull + build takes ~15 min.
        uses: actions/cache@v5
        with:
          path: ~/.cache/pj4-docker-layers
          key: pj4-appimage-docker-${{ hashFiles('appimage/Dockerfile.build') }}
          restore-keys: pj4-appimage-docker-

      - name: Persist Conan cache
        # build_release_appimage.sh mounts a persistent Docker volume for Conan;
        # export it after the build so the next run reuses the compiled deps.
        uses: actions/cache@v5
        with:
          path: ~/.cache/pj4-conan-appimage
          key: conan-appimage-${{ hashFiles('conanfile.txt', '**/conanfile.py', 'SDK_VERSION') }}
          restore-keys: conan-appimage-

      - name: Build release AppImage (docker mode)
        # Default mode: appimage/build_in_docker.sh + curated 13-plugin filter,
        # ROS2 multi-distro bundle produced by data_stream_ros2/docker/run-local.sh.
        # The orchestrator writes the .AppImage under appimage/ with a versioned
        # stamped name (PJ_VERSION + commit + utc).
        run: |
          bash appimage/build_release_appimage.sh
          # Locate the produced .AppImage — the orchestrator prints its final
          # path but we resolve it defensively by glob to survive stamp changes.
          appimage_path="$(ls -1 appimage/PlotJuggler-*.AppImage | head -n 1)"
          if [[ -z "$appimage_path" ]]; then
            echo "::error::AppImage not produced under appimage/" >&2
            exit 1
          fi
          echo "APPIMAGE=$appimage_path" >> "$GITHUB_ENV"
          echo "APPIMAGE_NAME=$(basename "$appimage_path")" >> "$GITHUB_ENV"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APPIMAGE_NAME }}
          path: ${{ env.APPIMAGE }}
          if-no-files-found: error

      - name: Attach AppImage to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APPIMAGE }}
          generate_release_notes: true
          fail_on_unmatched_files: true
