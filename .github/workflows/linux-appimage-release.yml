name: Release AppImage (embedded plugins)

# Builds the release-quality PlotJuggler 4 AppImage — the app + curated plugins
# EMBEDDED BY COMPILATION (not downloaded from the registry). The Linux sibling
# of windows-release.yml (which does the Windows installer).
#
# Architecture (2026-07 redesign, docs/plans/2026-07-16-appimage-ci-redesign.md):
#   * ros2-bundle job: host runner (needs the Docker daemon) builds the ROS 2
#     multi-distro bundle via data_stream_ros2/docker/run-local.sh --bundle.
#   * appimage job: runs INSIDE ghcr.io/plotjuggler/pj4-appimage-builder
#     (Ubuntu 22.04 / glibc 2.35 — hosted 22.04 runners retire 2027-04,
#     actions/runner-images#14254, so the floor lives in the container, not the
#     runner label). Third-party Conan binaries resolve from the JFrog remote
#     first and are published back on trusted runs; Qt / ccache / ~/.conan2 use
#     actions/cache. This replaces the former fat-Docker flow (image-baked Qt +
#     Conan closure persisted as multi-GB tarballs inside the 10 GB per-repo
#     Actions cache quota, where they evicted linux-ci's caches).
#
# Triggers:
#   - workflow_dispatch  -> build from any branch (artifact only, no Release upload)
#   - push of a `v*` tag -> build + attach the AppImage to that tag's Release
#
# Complements the pre-existing release.yml, which builds a lighter registry-driven
# AppImage. Kept as a separate file so a dispatched release build never races the
# registry-download variant on the same trigger.

on:
  workflow_dispatch:
  push:
    # TEMPORARY dry-run trigger — remove the branches list before merge.
    branches: [feat/appimage-ci-redesign]
    tags:
      - 'v*'

permissions:
  contents: write   # softprops/action-gh-release needs write to create/update the Release
  packages: read    # pull the builder image from GHCR

concurrency:
  group: linux-appimage-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros2-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Use HTTPS for github.com submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fetch pj-official-plugins into plotjuggler_sdk/pj_ported_plugins
        # run-local.sh lives in pj-official-plugins, which is not a submodule of
        # plotjuggler_sdk in this repo; clone the tip of main explicitly so the
        # released AppImage embeds the latest curated plugin set.
        shell: bash
        run: |
          set -euo pipefail
          target="plotjuggler_sdk/pj_ported_plugins"
          if [[ -d "$target/.git" || -f "$target/build.sh" ]]; then
            echo "$target already populated — skipping clone."
            exit 0
          fi
          rm -rf "$target"
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/PlotJuggler/pj-official-plugins.git "$target"

      - name: Compute ros2 bundle cache key
        # The bundle is a pure function of the plugins repo tip (the ros2
        # sources + run-local.sh) and the SDK submodule (conan-exported as
        # /core into every distro container).
        id: ros2key
        shell: bash
        run: |
          set -euo pipefail
          plugins_sha="$(git -C plotjuggler_sdk/pj_ported_plugins rev-parse HEAD)"
          sdk_sha="$(git -C plotjuggler_sdk rev-parse HEAD)"
          echo "key=ros2-bundle-v1-${plugins_sha}-${sdk_sha}" >> "$GITHUB_OUTPUT"

      - name: Restore ros2 bundle cache
        id: ros2cache
        uses: actions/cache@v5
        with:
          path: plotjuggler_sdk/pj_ported_plugins/dist_ros2
          key: ${{ steps.ros2key.outputs.key }}

      - name: Free up disk space on the runner
        # One Docker image per supported ROS 2 distro; the default runner's
        # free space does not hold them all. The rm -rf list matches
        # linux-ci.yml (seconds, vs minutes for the apt-based cleanup actions).
        if: steps.ros2cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Build ros2 proxy + all distros
        if: steps.ros2cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # --core must be ABSOLUTE: run-local.sh bind-mounts it as /core, and
          # docker treats a relative -v source as a named volume (empty dir).
          plotjuggler_sdk/pj_ported_plugins/data_stream_ros2/docker/run-local.sh \
            --bundle --core "${PWD}/plotjuggler_sdk"

      - name: Upload ros2 bundle
        uses: actions/upload-artifact@v4
        with:
          name: ros2-bundle
          # run-local.sh writes the bundle tree to the PLUGINS-REPO root
          # (pj_ported_plugins/dist_ros2) — NOT under data_stream_ros2/, which
          # is where build_release_appimage.sh reads it. The appimage job's
          # download step bridges that drift by placing the artifact at the
          # reader's path.
          path: plotjuggler_sdk/pj_ported_plugins/dist_ros2
          if-no-files-found: error

  appimage:
    runs-on: ubuntu-latest
    needs: ros2-bundle
    timeout-minutes: 240
    container:
      # Digest-pinned by appimage-builder-image.yml (it updates the repo
      # variable after each smoke-tested push); :latest is only the bootstrap
      # fallback for a repo where the variable does not exist yet.
      image: ${{ vars.PJ4_APPIMAGE_BUILDER_IMAGE || 'ghcr.io/plotjuggler/pj4-appimage-builder:latest' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Bind-mount the host's fat preinstalled-toolchain dirs so the first step
      # can empty them: a container job cannot run the usual host-side
      # `sudo rm -rf`, and the RelWithDebInfo app + plugins build needs the
      # space (linux-ci hit "ld: No space left on device" without the
      # equivalent cleanup).
      options: >-
        -v /usr/local:/host/usr/local
        -v /usr/share/dotnet:/host/dotnet
        -v /opt:/host/opt
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"   # linuxdeploy/appimagetool without FUSE
    steps:
      - name: Free host disk (from inside the container)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /host/usr/local/lib/android /host/usr/local/.ghcup \
                 /host/dotnet/* /host/opt/ghc /host/opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Use HTTPS for github.com submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fetch pj-official-plugins into plotjuggler_sdk/pj_ported_plugins
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          target="plotjuggler_sdk/pj_ported_plugins"
          if [[ -d "$target/.git" || -f "$target/build.sh" ]]; then
            echo "$target already populated — skipping clone."
            exit 0
          fi
          rm -rf "$target"
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/PlotJuggler/pj-official-plugins.git "$target"

      - name: Read versions.env
        shell: bash
        run: |
          set -euo pipefail
          source ./versions.env
          echo "PJ_APP_VERSION=${PJ_APP_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_QT_VERSION=${PJ_QT_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_APPIMAGE_ARCH=${PJ_APPIMAGE_ARCH}" >> "${GITHUB_ENV}"

      - name: Resolve release version
        # Tag build -> the tag verbatim; manual dispatch -> PJ_APP_VERSION from
        # versions.env so the artifact name still carries a meaningful version.
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            echo "PJ_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "PJ_VERSION=${PJ_APP_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v5
        with:
          path: .qt
          # Same key as linux-ci.yml -> shared hit on the ~1 GB aqt install.
          key: qt-${{ env.PJ_QT_VERSION }}-linux-gcc_64

      - name: Install Qt via aqt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: ./install_qt6.sh

      - name: Restore Conan cache
        id: conan-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.conan2
          # SDK_VERSION comes from the pj-official-plugins clone above (it is
          # not a PJ4 file), which is why the clone precedes this restore.
          key: conan-appimage-v1-${{ hashFiles('conanfile.txt', 'plotjuggler_sdk/pj_ported_plugins/SDK_VERSION') }}
          # Prefix fallbacks: an older appimage closure first, else seed from
          # linux-ci's saved closure — same ubuntu-22.04 / gcc-11 /
          # RelWithDebInfo / cppstd=20 profile, so its packages are directly
          # reusable here (the JFrog remote covers any residual miss).
          restore-keys: |
            conan-appimage-v1-
            conan-linux-gcc-relwithdebinfo-v2-

      - name: Restore ccache
        # Explicit restore/save split: the plain action's post-job save is
        # skipped when the job fails, which is exactly when preserving the
        # compiled objects matters most (failures here are usually late —
        # packaging or audit — after the full compile already happened).
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ccache
          key: ccache-appimage-${{ github.sha }}
          # Last fallback: linux-ci's cache from main — same source tree, same
          # gcc 11.4. Sharable because both sides hash with
          # compiler_check=content, hash_dir=false, base_dir (below).
          restore-keys: |
            ccache-appimage-
            ccache-linux-build-main-

      - name: Configure ccache
        # compiler_check=content + hash_dir=false + base_dir make object hashes
        # independent of the compiler binary's mtime and of the workspace root,
        # so this container job (/__w/PJ4/PJ4) and linux-ci's runner job
        # (/home/runner/work/PJ4/PJ4) hit each other's objects. Trade-off:
        # cached objects may embed the sibling workspace path in debug info.
        shell: bash
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --set-config=hash_dir=false
          ccache --set-config=base_dir="${GITHUB_WORKSPACE}"
          ccache -z

      - name: Configure public Conan repository (forks)
        if: github.repository != 'PlotJuggler/PJ4'
        shell: bash
        run: echo "PJ_USE_JFROG=false" >> "$GITHUB_ENV"

      - name: Configure JFrog Conan repository
        # workflow_dispatch and tag pushes are repo-actor-driven (no fork PR
        # code runs here), so the deploy-capable token is safe to use — same
        # trust model as linux-ci's non-PR path.
        if: github.repository == 'PlotJuggler/PJ4'
        id: conan_remote
        shell: bash
        env:
          JFROG_USER: ${{ vars.JFROG_USER || secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$JFROG_USER" || -z "$JFROG_TOKEN" ]]; then
            echo "::error::Configure JFROG_USER as an Actions variable or secret, and JFROG_TOKEN as an Actions secret."
            exit 1
          fi
          conan profile detect --force
          conan remote add plotjuggler-conan \
            "https://plotjuggler.jfrog.io/artifactory/api/conan/plotjuggler-conan" \
            --force --index=0
          conan remote login plotjuggler-conan "$JFROG_USER" -p "$JFROG_TOKEN"
          echo "PJ_USE_JFROG=true" >> "$GITHUB_ENV"
          echo "authenticated=true" >> "$GITHUB_OUTPUT"
          conan remote list

      - name: Seed Conan source download cache
        # minizip/1.2.13's zlib.net source URL rejects GitHub runners (HTTP
        # 415); reuse the checksum-verified repo-hosted seed like linux-ci.
        # Configured after the Conan cache restore so a restored global.conf
        # cannot clobber it.
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${RUNNER_TEMP}/conan-source-cache"
          mkdir -p "${cache_dir}/s"
          find .github/conan/source-backup -maxdepth 1 -type f ! -name README.md \
            -exec cp -f {} "${cache_dir}/s/" \;
          conan_home="$(conan config home)"
          conf="${conan_home}/global.conf"
          mkdir -p "${conan_home}"
          if [[ -f "$conf" ]]; then
            grep -v '^core\.sources:download_cache=' "$conf" > "${conf}.tmp" || true
            mv "${conf}.tmp" "$conf"
          fi
          echo "core.sources:download_cache=${cache_dir}" >> "$conf"

      - name: Conan install (app graph)
        # Resolve/build the app dependency graph up front so it can be
        # published immediately — a later compile failure must not discard an
        # otherwise reusable closure. build_release_appimage.sh's inner
        # ./build.sh re-resolves the same graph, which is then a fast no-op.
        id: conan_install
        shell: bash
        run: |
          set -euo pipefail
          conan profile detect --force
          conan_remotes=(-r=conancenter)
          if [[ "${PJ_USE_JFROG:-false}" == "true" ]]; then
            bash .github/scripts/sync-conan-recipes.sh \
              -s build_type=RelWithDebInfo -s compiler.cppstd=20
            conan_remotes=(-r=plotjuggler-conan -r=conancenter)
          fi
          conan install . --output-folder=build --build=missing "${conan_remotes[@]}" \
            -s build_type=RelWithDebInfo -s compiler.cppstd=20

      - name: Publish app closure to JFrog
        if: steps.conan_install.outcome == 'success' && steps.conan_remote.outputs.authenticated == 'true'
        shell: bash
        run: |
          # Existing revisions are skipped by Conan.
          conan upload "*" -r=plotjuggler-conan --confirm \
            -cc core.upload:parallel=4

      - name: Download ros2 bundle
        uses: actions/download-artifact@v4
        with:
          name: ros2-bundle
          path: plotjuggler_sdk/pj_ported_plugins/data_stream_ros2/dist_ros2

      - name: Link pinned linuxdeploy/appimagetool into appimage/
        # build_appimage.sh uses a pre-existing appimage/<tool>.AppImage instead
        # of downloading 'continuous' — so the image-pinned bytes are what runs.
        shell: bash
        run: |
          set -euo pipefail
          for tool in linuxdeploy linuxdeploy-plugin-qt appimagetool; do
            ln -sfn "/opt/linuxdeploy/${tool}-${PJ_APPIMAGE_ARCH}.AppImage" \
                    "appimage/${tool}-${PJ_APPIMAGE_ARCH}.AppImage"
          done

      - name: Build app + plugins and package the AppImage
        # --host-build: "host" here IS the jammy container (glibc 2.35 floor).
        # --skip-ros2: the bundle was downloaded above into the exact path the
        # script checks (data_stream_ros2/dist_ros2).
        shell: bash
        run: |
          set -euo pipefail
          bash appimage/build_release_appimage.sh --host-build --skip-ros2
          appimage_path="$(ls -1 appimage/PlotJuggler-*.AppImage | head -n 1)"
          if [[ -z "$appimage_path" ]]; then
            echo "::error::AppImage not produced under appimage/" >&2
            exit 1
          fi
          echo "APPIMAGE=$appimage_path" >> "$GITHUB_ENV"
          echo "APPIMAGE_NAME=$(basename "$appimage_path")" >> "$GITHUB_ENV"

      - name: Publish plugin/SDK closure to JFrog
        # Second upload AFTER the full build: the plugins' build_type=Release
        # dependency graph (Arrow Flight, gRPC, ...) is resolved inside
        # build_release_appimage.sh, not by the app-graph install above.
        if: always() && steps.conan_remote.outputs.authenticated == 'true'
        shell: bash
        run: |
          conan upload "*" -r=plotjuggler-conan --confirm \
            -cc core.upload:parallel=4 || true

      - name: Remove JFrog credentials from Conan home
        # ~/.conan2 is cached below; a deploy-capable token must never enter it.
        if: always() && steps.conan_remote.outputs.authenticated == 'true'
        shell: bash
        run: conan remote logout plotjuggler-conan

      - name: Trim Conan cache before saving
        if: always() && steps.conan-cache.outputs.cache-hit != 'true'
        shell: bash
        run: conan cache clean "*" --build --source --temp || true

      - name: Save Conan cache
        # always(): a failed app compile must still persist the expensive
        # third-party closure. Runs after logout (no credentials in the cache).
        if: always() && steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.conan2
          key: conan-appimage-v1-${{ hashFiles('conanfile.txt', 'plotjuggler_sdk/pj_ported_plugins/SDK_VERSION') }}

      - name: Save ccache
        # always(): keep the objects even when a late step fails. Skipped only
        # on an exact-key hit (immutable keys make re-saving a no-op anyway).
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ccache
          key: ccache-appimage-${{ github.sha }}

      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s || true

      - name: Audit AppImage glibc floor
        # The whole point of the container: nothing bundled may require a glibc
        # newer than 2.35. Extract and scan every ELF's versioned GLIBC_ needs.
        # Exempt the ROS 2 per-distro INNER binaries (ros2-topic-subscriber/
        # dist/<distro>/): they are deliberately built in each distro's own
        # container (jazzy/rolling -> Ubuntu 24.04 / glibc 2.38) and are only
        # dlopen'ed on machines that run that distro. The proxy .so the app
        # loads directly sits OUTSIDE dist/ and stays subject to the audit.
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cp "${APPIMAGE}" "${workdir}/app.AppImage"
          cd "${workdir}"
          ./app.AppImage --appimage-extract >/dev/null
          bad_found=""
          while IFS= read -r -d '' f; do
            case "$f" in
              */plugins/ros2-topic-subscriber/dist/*) continue ;;
            esac
            if file -b "$f" | grep -q ELF; then
              # readelf -V prints the version-needs section (.gnu.version_r) —
              # the actual GLIBC versions the loader will demand, unlike a raw
              # strings scan which also matches incidental mentions.
              bad="$(readelf -V "$f" 2>/dev/null | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | awk -F. '$2 > 35' || true)"
              if [[ -n "$bad" ]]; then
                echo "::error::${f#squashfs-root/} requires ${bad//$'\n'/, } (> GLIBC_2.35)"
                bad_found=1
              fi
            fi
          done < <(find squashfs-root -type f \( -name '*.so*' -o -perm -u+x \) -print0)
          if [[ -n "$bad_found" ]]; then
            exit 1
          fi
          echo "glibc floor OK: no bundled ELF requires > GLIBC_2.35"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APPIMAGE_NAME }}
          path: ${{ env.APPIMAGE }}
          if-no-files-found: error

      - name: Attach AppImage to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APPIMAGE }}
          generate_release_notes: true
          fail_on_unmatched_files: true
