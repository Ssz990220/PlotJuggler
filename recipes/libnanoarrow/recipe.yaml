schema_version: 1

# Apache Arrow nanoarrow C library + IPC extension. The conda-forge `nanoarrow`
# package is the *Python* binding, hence the `libnanoarrow` name here.
# Upstream CMake installs a proper nanoarrow config (targets
# nanoarrow::nanoarrow[_static] / nanoarrow::nanoarrow_ipc[_static]), which
# pj_datastore already consumes. flatcc runtime is vendored by upstream;
# pj_datastore links `flatccrt` by name, so its archive is installed alongside.

context:
  version: "0.7.0"

package:
  name: libnanoarrow
  version: ${{ version }}

source:
  url: https://github.com/apache/arrow-nanoarrow/archive/refs/tags/apache-arrow-nanoarrow-${{ version }}.tar.gz
  sha256: bb422ce7ed486abd95eb027a1ac092bbc1b5ed44955e89c098f0a1cb75109d5c

build:
  number: 0
  script:
    # Unix: conda cross-compiler ($CC/$CXX) → conda sysroot (2.28), no __isoc23_*.
    - if: unix
      then:
        - cmake -G Ninja -B build -S . -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_BUILD_TYPE=Release -DNANOARROW_IPC=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_INSTALL_LIBDIR=lib
        - cmake --build build
        - cmake --install build
        - if [ ! -e "$PREFIX/lib/libflatccrt.a" ]; then find build -name "libflatccrt*.a" -exec cp {} "$PREFIX/lib/" \; ; fi
    - if: win
      then:
        - cmake -G Ninja -B build -S . -DCMAKE_BUILD_TYPE=Release -DNANOARROW_IPC=ON -DCMAKE_INSTALL_PREFIX="%LIBRARY_PREFIX%"
        - cmake --build build --config Release
        - cmake --install build
        - if not exist "%LIBRARY_PREFIX%\lib\flatccrt.lib" for /r build %%f in (flatccrt*.lib) do copy /Y "%%f" "%LIBRARY_PREFIX%\lib\"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    # Linux only: pins the target glibc sysroot (see recipes/variants.yaml).
    - if: linux
      then:
        - ${{ stdlib('c') }}
    - cmake
    - ninja

about:
  homepage: https://arrow.apache.org/nanoarrow/
  license: Apache-2.0
  summary: nanoarrow — helpers for the Arrow C data and IPC interfaces (C library, with IPC extension)
