# conda-forge-style stdlib pinning. Declaring c_stdlib=sysroot wires the
# compiler's --sysroot to the conda glibc (2.28); without it rattler-build's
# compiler falls back to the (newer) system glibc headers and the archives end
# up referencing __isoc23_* symbols that won't resolve against the sysroot.
c_stdlib:
  - sysroot
c_stdlib_version:
  - "2.28"
